run:
  name: california-2035-county
  benchmark_cpuc: true
  disable_progressbar: false
  shared_resources: false
  shared_cutouts: true
  validation: false
  benchmark_cpuc_horizons:
  - 2026
scenario:
  planning_horizons:
  - 2035
  clusters:
  - 25
  scope: total
  opts:
  - REM-ERM-3h
  simpl:
  - county
  interconnect:
  - western
  ll:
  - v1.0
  sector: E
model_topology:
  interface_transmission_limits: true
  include:
    reeds_state:
    - CA
  topological_boundaries: county
  county_groups: ../../configs/county_groups_25.csv
  transmission_network: reeds
  aggregate: {}
renewable_scenarios:
- historical
electricity:
  extendable_carriers:
    Generator:
    - solar
    - onwind
    - offwind_floating
    - OCGT
    - CCGT
    - CCGT-95CCS
    - nuclear
    - hydrogen_ct
    StorageUnit:
    - 4hr_battery_storage
    - 8hr_battery_storage
    Store: []
    Link: []
  remote_contracted_resources:
    enable: true
    file: repo_data/CPUC/servm_out_of_state_units.csv
  demand:
    profile: servm
    bus_allocation: population
    scenario:
      efs_case: reference
      efs_speed: moderate
      eer_file: demand_EER2025_100by2050.h5
      aeo: reference
      servm_weather_years:
      - 2019
  imports:
    enable: true
    representation: generator
    costs: 60
    volume_limit: 25
    balancing_period: year
    co2_emissions: 0.428
    capacity_limit: true
  exports:
    enable: true
    volume_limit: 25
    balancing_period: year
    costs: 40
    capacity_limit: true
  conventional_carriers:
  - nuclear
  - oil
  - OCGT
  - CCGT
  - coal
  - geothermal
  - biomass
  - waste
  renewable_carriers:
  - onwind
  - offwind_floating
  - solar
  - hydro
  retirement: economic
  honor_planned_retirements: true
  SAFE_reservemargin: 0.14
  SAFE_regional_reservemargins: repo_data/config/policy_constraints/SAFE_regional_prm.csv
  erm:
    all: 0.15
  regional_Co2_limits: repo_data/config/policy_constraints/regional_Co2_limits.csv
  technology_capacity_targets: repo_data/config/policy_constraints/technology_capacity_targets.csv
  portfolio_standards: repo_data/config/policy_constraints/portfolio_standards.csv
  transmission_interface_limits: repo_data/config/policy_constraints/transmission_interface_limits.csv
  demand_response:
    shift: 0
    marginal_cost: 999999
conventional:
  unit_commitment: true
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true
  ambient_derate:
    enable: false
    source: cpuc_servm
    replaces_seasonal_derate: true
clustering:
  aggregation_strategies:
    generators:
      p_min_pu: capacity_weighted_average
      up_time_before: max
      build_year: capacity_weighted_average
      lifetime: capacity_weighted_average
      start_up_cost: sum
      min_up_time: capacity_weighted_average
      min_down_time: capacity_weighted_average
      ramp_limit_up: capacity_weighted_average
      ramp_limit_down: capacity_weighted_average
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  simplify_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
  cluster_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
    exclude_carriers: []
    consider_efficiency_classes: false
  temporal:
    resolution_elec: 3h
    resolution_sector: false
solving:
  mem: 30000
  options:
    load_shedding: false
    clip_p_max_pu: 0.01
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    highs-default:
      threads: 4
      solver: ipm
      run_crossover: 'off'
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: 'on'
      random_seed: 123
    gurobi-default:
      threads: 8
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol: 1.0e-05
      OptimalityTol: 0.0001
      FeasibilityTol: 0.001
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      name: gurobi
      NumericFocus: 3
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol: 1.0e-05
      FeasibilityTol: 0.0001
      OptimalityTol: 0.0001
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback:
      name: gurobi
      crossover: 0
      method: 2
      BarHomogeneous: 1
      BarConvTol: 1.0e-05
      FeasibilityTol: 1.0e-05
      OptimalityTol: 1.0e-05
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4
      solutiontype: 2
      barrier.convergetol: 1.0e-05
      feasopt.tolerance: 1.0e-06
    cbc-default: {}
    glpk-default: {}
  walltime: '12:00:00'
renewable:
  dataset: atlite
  godeeep_cf_weighting: capacity
  EGS:
    dispatch: baseload
    drilling_cost: advanced
    seismic_exclusion: true
  onwind:
    cutout: era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
      add_cutout_windspeed: true
    capacity_per_sqkm: 3
    correction_factor: 1
    corine:
      grid_codes:
      - 20
      - 30
      - 40
      - 60
      - 100
      - 111
      - 112
      - 113
      - 114
      - 115
      distance: 10
      distance_grid_codes:
      - 50
    natura: true
    cec: true
    potential: conservative
    clip_p_max_pu: 0.01
    extendable: true
  offwind:
    cutout: era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_2020ATB_5.5MW
    capacity_per_sqkm: 3
    correction_factor: 1
    corine:
      grid_codes:
      - 80
      - 200
    natura: true
    boem_screen: false
    max_depth: 60
    min_shore_distance: 22000
    max_shore_distance: 65000
    potential: conservative
    clip_p_max_pu: 0.01
    extendable: true
  offwind_floating:
    cutout: era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_2020ATB_15MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 3
    correction_factor: 1
    corine:
      grid_codes:
      - 80
      - 200
    natura: true
    boem_screen: true
    min_depth: 60
    max_depth: 1300
    min_shore_distance: 22000
    max_shore_distance: 65000
    potential: conservative
    clip_p_max_pu: 0.01
    extendable: true
  solar:
    cutout: era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal
    capacity_per_sqkm: 4.6
    correction_factor: 1
    corine:
      grid_codes:
      - 20
      - 30
      - 60
      - 90
      - 100
    natura: true
    cec: true
    potential: conservative
    clip_p_max_pu: 0.01
    extendable: true
  hydro:
    cutout: era5
    carriers:
    - ror
    - PHS
    - hydro
    resource:
      method: hydro
    extendable: true
